name: Deploy Site

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'fastlane/metadata/android/**'
      - 'bin/site/site-screenshots.sh'
      - '.github/workflows/deploy-site.yml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: sudo apt-get update && sudo apt-get install -y webp
      - run: ./bin/site/site-screenshots.sh
      - run: ./bin/site/install-hugo.sh
      - run: hugo --source site --minify
      # Build the Pages tarball ourselves. actions/upload-pages-artifact tars with
      # --exclude=".[^/]*", which drops every top-level dotfile/dir — including
      # /.well-known/, where the App Links assetlinks.json must be served from. We mirror
      # its tar (same Pages artifact format) but keep dot-directories.
      - name: Archive Pages artifact (keep .well-known)
        run: |
          tar \
            --dereference --hard-dereference \
            --exclude=.git \
            --exclude=.github \
            -cf "${RUNNER_TEMP}/artifact.tar" \
            -C site/public .
      - uses: actions/upload-artifact@v7
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          include-hidden-files: true
          retention-days: 1

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
