name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    # contents: read for checkout; statuses: write to link the coverage report from the commit.
    permissions:
      contents: read
      statuses: write
    # Exposed for the "publish coverage" steps' `if:` guard so they are skipped (not failed) until
    # the secret is created — see the coverage-publishing steps at the end of the job.
    env:
      COVERAGE_PAGES_TOKEN: ${{ secrets.COVERAGE_PAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      # Run the debug unit tests and generate a separate Kover coverage report per module.
      # The unprefixed task names run in all three modules; the Debug variant matches the unit
      # tests (the "all code" variant would also pull in release and skew the numbers).
      # --continue so every module's tests run even if one fails — Test Analytics (below) needs
      # the complete JUnit results to detect flakes and track failures.
      - run: ./gradlew testDebugUnitTest koverHtmlReportDebug koverXmlReportDebug --continue
      # At-a-glance per-module coverage table, rendered on the run's summary page (no download).
      - name: Coverage summary
        run: python3 bin/coverage-report.py --format md >> "$GITHUB_STEP_SUMMARY"
      # Upload each module's XML to Codecov under its own flag, so coverage is browsable per
      # module in the web UI. fail_ci_if_error stays false so a Codecov hiccup never fails the build.
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: shared/build/reports/kover/reportDebug.xml
          flags: shared
          name: shared
          disable_search: true
          fail_ci_if_error: false
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: app/build/reports/kover/reportDebug.xml
          flags: app
          name: app
          disable_search: true
          fail_ci_if_error: false
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: wear/build/reports/kover/reportDebug.xml
          flags: wear
          name: wear
          disable_search: true
          fail_ci_if_error: false
      # Codecov Test Analytics — flaky-test detection, failure history, and slowest tests.
      # Uses the unified codecov-action with report_type: test_results (the standalone
      # test-results-action is deprecated). `if: !cancelled()` so results upload even when the
      # test step failed (the point is to capture failures). Gradle writes JUnit XML as TEST-*.xml,
      # so the paths are given explicitly rather than relying on the default `*junit.xml` search.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: shared/build/test-results/testDebugUnitTest/*.xml,app/build/test-results/testDebugUnitTest/*.xml,wear/build/test-results/testDebugUnitTest/*.xml
          disable_search: true
          fail_ci_if_error: false
      # Coverage gates: fail the build if any module's line coverage regresses below the bound
      # configured in its build.gradle.kts (:shared ≥98, :app ≥97, :wear ≥93). Runs last so coverage
      # + test-analytics data is still uploaded even when a gate fails. The unqualified task name runs
      # the verify rule in all three modules; --continue reports every failing module, not just the first.
      - name: Verify coverage gates
        run: ./gradlew koverVerifyDebug --continue
      # Publish this commit's per-module Kover HTML to the shared jmerhar/coverage site. The site
      # (project/commit indexes, cross-links) is built there; here we only push the raw report.
      # Only on green pushes to main, and only once COVERAGE_PAGES_TOKEN exists (so the workflow
      # stays green before it is set up).
      - name: Collect coverage upload
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && env.COVERAGE_PAGES_TOKEN != ''
        run: bin/collect-coverage.sh coverage-upload
      - name: Check out the coverage repo
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && env.COVERAGE_PAGES_TOKEN != ''
        uses: actions/checkout@v6
        with:
          repository: jmerhar/coverage
          token: ${{ secrets.COVERAGE_PAGES_TOKEN }}
          path: coverage-repo
      - name: Publish coverage report
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && env.COVERAGE_PAGES_TOKEN != ''
        run: |
          coverage-repo/bin/add-report.sh \
            --repo coverage-repo \
            --project sweetspot-android \
            --sha "$GITHUB_SHA" \
            --message "$(git log -1 --pretty=%s)" \
            --commit-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA" \
            --report-dir coverage-upload
      # Link the report from the commit's checks in this repo.
      - name: Link coverage report from the commit
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && env.COVERAGE_PAGES_TOKEN != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/statuses/$GITHUB_SHA" \
            -f state=success -f context="coverage/report" \
            -f description="Kover HTML coverage report" \
            -f target_url="https://jmerhar.github.io/coverage/sweetspot-android/$GITHUB_SHA/"
