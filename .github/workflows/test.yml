name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    # Exposed for the "publish coverage" step's `if:` guard so it is skipped (not failed) until
    # the secret is created — see the Pages steps at the end of the job.
    env:
      COVERAGE_PAGES_TOKEN: ${{ secrets.COVERAGE_PAGES_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      # Run the debug unit tests and generate a separate Kover coverage report per module.
      # The unprefixed task names run in all three modules; the Debug variant matches the unit
      # tests (the "all code" variant would also pull in release and skew the numbers).
      # --continue so every module's tests run even if one fails — Test Analytics (below) needs
      # the complete JUnit results to detect flakes and track failures.
      - run: ./gradlew testDebugUnitTest koverHtmlReportDebug koverXmlReportDebug --continue
      # At-a-glance per-module coverage table, rendered on the run's summary page (no download).
      - name: Coverage summary
        run: python3 bin/coverage-report.py --format md >> "$GITHUB_STEP_SUMMARY"
      # Upload each module's XML to Codecov under its own flag, so coverage is browsable per
      # module in the web UI. fail_ci_if_error stays false so a Codecov hiccup never fails the build.
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: shared/build/reports/kover/reportDebug.xml
          flags: shared
          name: shared
          disable_search: true
          fail_ci_if_error: false
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: app/build/reports/kover/reportDebug.xml
          flags: app
          name: app
          disable_search: true
          fail_ci_if_error: false
      - uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: wear/build/reports/kover/reportDebug.xml
          flags: wear
          name: wear
          disable_search: true
          fail_ci_if_error: false
      # Codecov Test Analytics — flaky-test detection, failure history, and slowest tests.
      # Uses the unified codecov-action with report_type: test_results (the standalone
      # test-results-action is deprecated). `if: !cancelled()` so results upload even when the
      # test step failed (the point is to capture failures). Gradle writes JUnit XML as TEST-*.xml,
      # so the paths are given explicitly rather than relying on the default `*junit.xml` search.
      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
          files: shared/build/test-results/testDebugUnitTest/*.xml,app/build/test-results/testDebugUnitTest/*.xml,wear/build/test-results/testDebugUnitTest/*.xml
          disable_search: true
          fail_ci_if_error: false
      # Coverage gate: fail the build if :shared line coverage regresses below the bound configured
      # in shared/build.gradle.kts. Runs last so coverage + test-analytics data is still uploaded
      # even when the gate fails. (Only :shared has a verify rule; :app/:wear are ungated.)
      - name: Verify :shared coverage
        run: ./gradlew :shared:koverVerifyDebug
      # Publish the per-module Kover HTML reports to the shared jmerhar/coverage Pages site.
      # Only on green pushes to main, and only once the COVERAGE_PAGES_TOKEN secret exists (so the
      # workflow stays green before it is set up). Layout on the site: /<project>/<module>/.
      - name: Assemble Kover HTML for Pages
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && env.COVERAGE_PAGES_TOKEN != ''
        run: bin/build-coverage-site.sh coverage-site
      - name: Publish coverage to GitHub Pages
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main' && env.COVERAGE_PAGES_TOKEN != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.COVERAGE_PAGES_TOKEN }}
          external_repository: jmerhar/coverage
          publish_branch: gh-pages
          publish_dir: ./coverage-site
          destination_dir: sweetspot-android
          keep_files: true
          commit_message: "Update sweetspot-android coverage [skip ci]"
