name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test:
    runs-on: ubuntu-latest
    # contents: read for checkout; statuses: write to link the coverage report from the commit.
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6
      # Validate the repo's Python tooling — the data builders' pure logic, no network.
      # Fast, so run before the Android tests.
      - name: Run script unit tests
        run: make test-scripts
      # Guard the Play Store listing fields against exceeding Google's per-field length limits,
      # so a translation can't silently overflow and be rejected at upload time.
      - name: Check listing lengths
        run: make check-listing
      # Run the debug unit tests and generate a separate Kover coverage report per module.
      # The unprefixed task names run in all three modules; the Debug variant matches the unit
      # tests (the "all code" variant would also pull in release and skew the numbers).
      # --continue so every module's tests run even if one fails — Test Analytics (below) needs
      # the complete JUnit results to detect flakes and track failures.
      - run: ./gradlew testDebugUnitTest koverHtmlReportDebug koverXmlReportDebug --continue
      # At-a-glance per-module coverage table, rendered on the run's summary page (no download).
      # The modules, their labels and their gates are declared in coverage.toml; the tooling behind
      # these steps is shared by every project that publishes to the coverage site.
      - uses: jmerhar/coverage/.github/actions/summary@v1
      # Codecov is informational (see codecov.yml) — the gate below is the actual check — so this never
      # fails the build, and runs before the gate so the data lands even when the gate fails. Each
      # module's XML is derived from coverage.toml and uploaded under its own flag, so coverage stays
      # browsable per module. The JUnit reports Gradle writes give Codecov flake detection, failure
      # history and slowest tests; `!cancelled()` so a failed suite still reports its failures.
      - uses: jmerhar/coverage/.github/actions/codecov@v1
        if: ${{ !cancelled() }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          junit: shared/build/test-results/testDebugUnitTest/*.xml,app/build/test-results/testDebugUnitTest/*.xml,wear/build/test-results/testDebugUnitTest/*.xml

      # Coverage gates: fail the build if any module's line coverage regresses below the bound in
      # coverage.toml. Runs after the uploads above so coverage and test-analytics data still lands
      # when the gate fails, and before publishing so a regression never reaches the site.
      - uses: jmerhar/coverage/.github/actions/gate@v1
      # Publish this commit's per-module Kover HTML to the shared coverage site, and link it from the
      # commit. Only on green pushes to main; the action itself skips when the token is absent, so
      # this stays green if the secret is ever missing.
      - uses: jmerhar/coverage/.github/actions/publish@v1
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          token: ${{ secrets.COVERAGE_PAGES_TOKEN }}
          description: Kover HTML coverage report
