<VirtualHost *:443>
    ServerName stats.sweetspot.today
    DocumentRoot /var/www/stats.sweetspot.today

    # TLS — Cloudflare Origin CA certificate (Cloudflare handles public TLS)
    SSLEngine on
    SSLCertificateFile /etc/ssl/certs/sweetspot.today.pem
    SSLCertificateKeyFile /etc/ssl/private/sweetspot.today.key

    # Rewrite /report to stats.php
    RewriteEngine On
    RewriteRule ^/report$ /stats.php [L]

    <Directory /var/www/stats.sweetspot.today>
        AllowOverride FileInfo AuthConfig
        Require all granted

        # Only allow POST to stats.php (GET etc. are rejected by the script,
        # but no need to even invoke PHP for other paths)
        <Files "stats.php">
            Require all granted
        </Files>
    </Directory>

    # Deny access to everything except /report
    <LocationMatch "^/(?!report$)">
        Require all denied
    </LocationMatch>

    # Derive the real client IP from Cloudflare's CF-Connecting-IP header for rate
    # limiting. RemoteIPTrustedProxy restricts that to connections arriving from
    # Cloudflare's own edge ranges — without it, a client reaching the origin directly
    # could spoof the header and forge its client IP to evade the rate limiter.
    # Refresh these ranges from https://www.cloudflare.com/ips/ if Cloudflare changes them.
    RemoteIPHeader CF-Connecting-IP
    RemoteIPTrustedProxy 173.245.48.0/20 103.21.244.0/22 103.22.200.0/22 \
        103.31.4.0/22 141.101.64.0/18 108.162.192.0/18 190.93.240.0/20 \
        188.114.96.0/20 197.234.240.0/22 198.41.128.0/17 162.158.0.0/15 \
        104.16.0.0/13 104.24.0.0/14 172.64.0.0/13 131.0.72.0/22
    RemoteIPTrustedProxy 2400:cb00::/32 2606:4700::/32 2803:f800::/32 \
        2405:b500::/32 2405:8100::/32 2a06:98c0::/29 2c0f:f248::/32

    # Logging
    ErrorLog ${APACHE_LOG_DIR}/stats.sweetspot.today/error.log
    CustomLog ${APACHE_LOG_DIR}/stats.sweetspot.today/access.log combined
</VirtualHost>

# Redirect HTTP to HTTPS (Cloudflare normally handles this,
# but good to have in case of direct access)
<VirtualHost *:80>
    ServerName stats.sweetspot.today
    RewriteEngine On
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]
</VirtualHost>
